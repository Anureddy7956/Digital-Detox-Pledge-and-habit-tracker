<style>

}

/* stats & lists */
.stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}

    d = { v: 1, active: null, theme: 'auto', profiles: {} };

      for (let i = 0; i < localStorage.length; i++) {

/* ================= Streak & adherence engine ================= */
const PASS = 0.75; // a day counts when >= 75% of pledges are kept
function prog(x, d) {

    case 'offline': return d.off / x.target;
    case 'focus': return d.focus / x.target;
    case 'steps': return d.steps / x.target;

/* ================= Actions (event delegation) ================= */
function pickFile(accept, fn) { const i = $('#file'); i.value = ''; i.accept = accept; i.onchange = async () => { const f = i.files[0]; if (f) try { await fn(f); } catch (e) { toast(e.message || 'Import failed', 'er'); } }; i.click(); }
const adopt = (q, msg) => { db.profiles[q.id] = q; db.active = q.id; ui.view = 'home'; Store.emit('db'); Sound.sig(Capsule.encode(q)); toast(msg, 'ok'); };
const ACT = {
  tab: v => { ui.view = v; Store.emit('view'); scrollTo(0, 0); },
  sensors: () => S.st === 'idle' ? Sens.enable(true) : sensorSheet(),
  retrySensors: () => { closeSheet(); S.st = 'idle'; Sens.enable(true); },
  profiles: () => openSheet(`<h2>Profiles</h2>${Object.values(db.profiles).map(q => `<button class="prow${q.id === db.active ? ' on' : ''}" data-act="switchTo" data-v="${q.id}">${avatar(q.av, 40)}<span class="f1"><b>${esc(q.name)}</b><small class="mu">${streak(q).n}-day streak</small></span>${q.pinF ? ic('lock') : ''}${q.id === db.active ? ic('check') : ''}</button>`).join('')}<button class="btn wide mt" data-act="newProfile">${ic('plus')}Add profile</button>`),
  switchTo: id => { closeSheet(); const q = db.profiles[id]; if (!q || id === db.active) return; if (Ses.cur) return toast('Finish the current session first', 'wa'); q.pinF ? showLock(id) : (unlockTo(id), toast('Switched to ' + q.name)); },
  lockTo: id => db.profiles[id].pinF ? showLock(id) : unlockTo(id),
  pin: v => pinKey(v),
  newProfile: () => { closeSheet(); showOnboard(true); },
  obKind: (v, el) => { const k = ui.ob.kinds; k.has(v) ? k.delete(v) : k.add(v); el.classList.toggle('on', k.has(v)); },
  obCancel: () => { $('#ob').hidden = true; ui.ob = null; },
  obDone: () => {
    const name = $('#ob-name').value.trim().slice(0, 30); if (!name) { toast('What should we call you?', 'er'); return $('#ob-name').focus(); }
    if (S.st === 'idle') Sens.enable(true); // iOS: ask for motion access inside this tap
    const p = newProfile(name, { ...ui.av }, [...ui.ob.kinds]); ui.ob = null; $('#ob').hidden = true;
    adopt(p, `Pledge signed. Welcome, ${name}!`); Sound.chord(); buzz([20, 40, 20]);
  },
  avH: v => { ui.av.h = +v; refreshAv(); }, avG: v => { ui.av.g = +v; refreshAv(); },
  editProfile: () => { const p = P(); ui.av = { ...p.av }; openSheet(`<h2>Edit profile</h2><label class="fl"><span>Name</span><input id="pf-name" type="text" maxlength="30" value="${esc(p.name)}"></label><div class="fl"><span>Avatar</span>${avPicker(ui.av)}</div><label class="fl"><span>${p.pinF ? 'New PIN (blank = keep)' : 'PIN lock (optional)'}</span><input id="pf-pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" autocomplete="new-password"></label>${p.pinF ? '<label class="sw"><input type="checkbox" id="pf-nopin"><span></span>Remove PIN</label>' : ''}<p class="mu sm mt">The PIN stops casual access on a shared device. Data never leaves this device.</p><div class="flex mt"><button class="btn ghost danger" data-act="delProfile">${ic('trash')}Delete</button><span class="f1"></span><button class="btn pri" data-act="saveProfile">Save</button></div>`); },
  saveProfile: async () => {
    const p = P(), name = $('#pf-name').value.trim().slice(0, 30), pin = $('#pf-pin').value.trim();
    if (!name) return toast('Name can’t be empty', 'er'); if (pin && !/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits', 'er');
    p.name = name; p.av = { ...ui.av };
    if ($('#pf-nopin')?.checked) p.pinF = p.pinS = null; else if (pin) Object.assign(p, await hashPin(pin, p.salt));
    closeSheet(); Store.emit('db'); toast('Profile saved', 'ok');
  },
  delProfile: () => confirmSheet('Delete this profile?', `All of ${esc(P().name)}’s pledges, history and badges will be erased from this device.`, 'Delete', () => {
    if (Ses.cur?.pid === db.active) { Ses.cur = null; Wake.set('ses', false); Sound.stopAmb(); try { localStorage.removeItem(LIVE); } catch {} }
    try { localStorage.removeItem(KEY + '.cap.' + db.active); } catch {}
    delete db.profiles[db.active]; db.active = Object.keys(db.profiles)[0] || null; save(true);
    if (!db.active) showOnboard(false); else if (P().pinF) showLock(db.active);
    Store.emit('db');
  }),
  check: id => { const d = todayRec(); if (d.ck[id]) delete d.ck[id]; else { d.ck[id] = 1; Sound.blip(); } buzz(12); Store.emit('db'); celebrate(checkBadges()); },
  addPledge: () => pledgeSheet(null, 'offline'), editPledge: id => pledgeSheet(id), pk: v => pledgeSheet(null, v),
  savePledge: () => {
    const p = P(), { id, kind } = ui.pe, K = KINDS[kind], x = id && p.pledges.find(q => q.id === id);
    const target = kind === 'custom' ? 1 : Math.min(K.max, Math.round(+$('#pe-t').value));
    if (!(target >= 1)) return toast('Enter a target of at least 1', 'er');
    const app = ($('#pe-app')?.value || '').trim().slice(0, 24) || 'Instagram';
    let label = $('#pe-label').value.trim().slice(0, 40);
    if (!label || (x && label === x.label && x.label === defLabel(x.kind, x.target, x.app))) label = defLabel(kind, target, app);
    if (x) Object.assign(x, { target, app, label });
    else { if (p.pledges.length >= 12) return toast('Up to 12 pledges', 'er'); p.pledges.push({ id: uid(), kind, target, app, label }); }
    p.signed = dayKey(); closeSheet(); Store.emit('db'); toast('Pledge saved', 'ok');
  },
  delPledge: id => confirmSheet('Remove pledge?', 'Past days will be re-scored without it.', 'Remove', () => { const p = P(); p.pledges = p.pledges.filter(x => x.id !== id); p.signed = dayKey(); Store.emit('db'); }),
  dur: v => { ui.dur = +v; renderFocus(); },
  startPledge: () => { if (S.st === 'idle') Sens.enable(true); Ses.start('pledge', ui.dur); },
  startFlip: () => { if (S.st === 'idle') Sens.enable(true); Ses.start('flip'); },
  endSes: () => { const c = Ses.cur; if (!c) return; c.kind === 'pledge' ? confirmSheet('End focus pledge early?', 'Ending before the timer finishes logs a breach. Minutes you focused still count.', 'End pledge', () => Ses.end('quit')) : Ses.end('manual'); },
  amb: v => { P().set.amb = v; save(); clearTimeout(ui.ambT); Sound.ambient(v); if (!Ses.cur) ui.ambT = setTimeout(() => { if (!Ses.cur) Sound.stopAmb(); }, 3500); renderFocus(); },
  trend: v => { ui.trend = v; renderHome(); },
  walkMode: () => { if (S.st === 'idle') Sens.enable(true); ui.walkMode = !ui.walkMode; Wake.set('walk', ui.walkMode); toast(ui.walkMode ? 'Walk mode on: screen stays awake' : 'Walk mode off'); renderWalk(); },
  pocket: () => { ui.pocket = true; Wake.set('pocket', true); dimHud(); },
  sens: v => { P().set.sens = +v; save(); render(); },
  theme: v => { db.theme = v; applyTheme(); save(); render(); },
  badge: id => { const b = BADGES.find(x => x.id === id), t = P().badges[id]; openSheet(`<div class="center"><div class="bbig">${badgeSvg(b, t)}</div><h2>${b.name}</h2><p class="mu">${b.desc}</p><p class="sm mt">${t ? 'Unlocked ' + fmtDate(new Date(t)) : 'Not unlocked yet'}</p></div>`); },
  exportJson: () => { const p = P(); download(new Blob([JSON.stringify({ app: 'unplug', v: 1, exported: new Date().toISOString(), profile: p })], { type: 'application/json' }), `unplug-${slug(p.name)}-${dayKey()}.json`); Sound.sig(Capsule.encode(p)); toast('Backup exported · sonic snapshot played', 'ok'); },
  importJson: () => pickFile('application/json,.json', async f => {
    const q = JSON.parse(await f.text())?.profile; if (!q || typeof q !== 'object' || !q.name) throw Error('Not an Unplug backup file');
    normProfile(q); const old = db.profiles[q.id], go = () => adopt(q, `Imported ${q.name}`);
    old ? confirmSheet('Replace profile?', `“${esc(old.name)}” already exists here. Replace it with the backup?`, 'Replace', go) : go();
  }),
  playTone: () => { if (!Sound.ok()) return toast('Turn on sound effects first', 'wa'); const b = audioBytes(P()); toast(`Playing ${b.length}-byte data tone (${Modem.schedule(Sound.ctx, Sound.out, b, Sound.ctx.currentTime + 0.05).toFixed(1)}s)`); },
  saveWav: async () => { const p = P(); download(await Modem.wav(audioBytes(p)), `unplug-tone-${slug(p.name)}-${dayKey()}.wav`); toast('Tone saved. Restore it later with “Restore .wav”', 'ok'); },
  loadWav: () => pickFile('audio/wav,.wav', async f => {
    const c = Sound.init(); if (!c) throw Error('Web Audio unavailable');
    const buf = await decodeAudio(c, await f.arrayBuffer()), bytes = Modem.decode(buf.getChannelData(0), buf.sampleRate);
    adopt(fromCapsule(Capsule.decode(bytes)), `Decoded ${bytes.length} bytes from audio · restored as a new profile`);
  }),
  copyCap: async () => { const s = b64e(Capsule.encode(P())); try { await navigator.clipboard.writeText(s); toast(`Capsule copied (${s.length} chars)`, 'ok'); } catch { openSheet(`<h2>Data capsule</h2><textarea readonly style="width:100%;height:140px;font:12px monospace;padding:10px;border-radius:12px">${s}</textarea>`); } },
  clearHist: () => confirmSheet('Clear all history?', 'Days, streaks and badges for this profile are erased. Pledges stay.', 'Clear', () => { const p = P(); p.days = {}; p.badges = {}; p.stats = {}; p.best = 0; Store.emit('db'); }),
  simFlip: () => simSet(178, 0), simUp: () => simSet(8, 0), simShake: () => { Sim.shake = performance.now() + 900; },
  simWalk: () => { Sim.walk = !Sim.walk; render(); },
  closeSheet, cfm: () => { const f = ui.cfm; ui.cfm = null; closeSheet(); f?.(); }
};
const CHG = {
  auto: el => { P().set.auto = el.checked; save(); }, awake: el => { ui.awake = el.checked; Wake.set('arm', el.checked); },
  sound: el => { P().set.sound = el.checked; if (!el.checked) Sound.stopAmb(); save(); }, hap: el => { P().set.hap = el.checked; save(); },
  height: el => { P().set.height = clamp(+el.value || 170, 100, 230); save(); }, goal: el => { P().set.goal = clamp(+el.value || 8000, 500, 1e5); save(); }
};
const simSet = (b, g) => { Sim.b = b; Sim.g = g; $$('[data-in]').forEach(e => e.value = e.dataset.in === 'simB' ? b : g); setT('sb', b + '°'); setT('sg', g + '°'); };
const INP = { simB: el => { Sim.b = +el.value; setT('sb', el.value + '°'); }, simG: el => { Sim.g = +el.value; setT('sg', el.value + '°'); } };

/* ================= Render loop & boot ================= */
const VIEWS = { home: renderHome, focus: renderFocus, walk: renderWalk, pledges: renderPledges, me: renderMe };
let rq = 0;
function render() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; if (!P()) return; renderHeader(); $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + ui.view)); try { VIEWS[ui.view](); } catch (e) { console.error(e); } }); }
function dimHud() {
  const want = ui.pocket || (Ses.cur && S.down && S.real), el = $('#dim'); el.hidden = !want; if (!want) return;
  const c = Ses.cur;
  setT('dm-l', c ? (c.kind === 'pledge' ? 'Focus pledge' : 'Deep Detox') : 'Pocket mode');
  setT('dm-t', c ? fmtClock(c.kind === 'pledge' ? c.tgt - Ses.el() : Ses.el()) : num(peek(dayKey()).steps));
  setT('dm-s', c ? (S.down ? 'Flip up to end' : '') : 'steps today'); $('#dm-u').hidden = !ui.pocket;
}
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() { const t = !db.theme || db.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : db.theme; document.documentElement.dataset.theme = t; $('meta[name=theme-color]').content = t === 'dark' ? '#0a0d17' : '#f4f6fb'; }
function tick() {
  if (S.real) faceEval();
  Ses.tick(); Ped.flush();
  if (dayKey() !== ui.today) { ui.today = dayKey(); Store.emit('db'); }
  if (document.hidden) return;
  if (ui.view === 'focus') hud(); else if (ui.view === 'walk') walkHud();
  dimHud();
}
function boot() {
  db = load(); applyTheme(); mq.addEventListener?.('change', applyTheme);
  $('.nav').innerHTML = `<div class="brand">${logo(30)}Unplug</div>` + [['home', 'home', 'Today'], ['focus', 'focus', 'Detox'], ['walk', 'walk', 'Steps'], ['pledges', 'shield', 'Pledges'], ['me', 'user', 'Me']].map(([v, i, l]) => `<button data-act="tab" data-v="${v}">${ic(i)}<span>${l}</span></button>`).join('');
  Store.on('db', () => { save(); dayCheck(); render(); });
  Store.on('view', render);
  Store.on('session', () => { if (ui.view === 'focus') renderFocus(); dimHud(); });
  Store.on('sensor', () => { renderPill(); render(); });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; try { ACT[el.dataset.act]?.(el.dataset.v, el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, 'er'); } });
  document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el) CHG[el.dataset.chg]?.(el); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el) INP[el.dataset.in]?.(el); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); if (ui.locked && /^\d$/.test(e.key)) pinKey(e.key); if (ui.locked && e.key === 'Backspace') pinKey('del'); });
  ['click', 'touchend', 'keydown'].forEach(ev => addEventListener(ev, Sound.unlock, { capture: true, passive: true }));
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  const u = $('#dm-u'); let ht = 0; // hold-to-unlock for pocket mode
  u.addEventListener('pointerdown', () => { u.classList.add('hold'); ht = setTimeout(() => { ui.pocket = false; Wake.set('pocket', false); u.classList.remove('hold'); dimHud(); }, 900); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => u.addEventListener(ev, () => { clearTimeout(ht); u.classList.remove('hold'); }));
  document.addEventListener('visibilitychange', () => { const now = Date.now(); if (document.hidden) { Ses.hide(now); Ped.flush(true); save(true); } else { Ses.show(now); Wake.sync(); render(); } });
  addEventListener('pagehide', () => { Ped.flush(true); save(true); });
  addEventListener('unhandledrejection', e => console.warn('Unhandled:', e.reason));
  $('#app').hidden = false;
  if (!P()) showOnboard(false); else { Ses.recover(); if (P().pinF) showLock(db.active); celebrate(checkBadges()); }
  render();
  Sens.enable(false);
  setInterval(tick, 250);
  (function loop() { if (ui.view === 'walk' && !document.hidden) drawWave(); requestAnimationFrame(loop); })();
}
boot();
</script>
